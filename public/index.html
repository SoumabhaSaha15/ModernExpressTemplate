<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModernExpressTemplate — Core Stack</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --panel-2: #1d2130;
      --line: #2a2f3d;
      --ink: #e8eaf0;
      --muted: #9aa2b1;
      --tile: #f6f7fb;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1b2133 0%, var(--bg) 55%);
      color: var(--ink);
      min-height: 100vh;
      padding: 56px 24px 72px;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 40px
    }

    header h1 {
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 700;
      letter-spacing: -.02em
    }

    header h1 span {
      color: #7c8cff
    }

    header p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 15px;
      max-width: 60ch
    }

    .grid {
      max-width: 100%;
      margin: 0 auto;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #3b4470;
      box-shadow: 0 14px 34px -18px rgba(124, 140, 255, .55);
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--tile);
      display: grid;
      place-items: center;
      border: 1px solid #e6e8f0;
    }

    .logo img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      display: block
    }

    .logo .fallback {
      display: none;
      font-weight: 800;
      font-size: 22px;
      color: #2b2f3a
    }

    .meta h2 {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -.01em
    }

    .meta p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px
    }

    .pill {
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      color: #aeb6ff;
      background: rgba(124, 140, 255, .14);
      border: 1px solid rgba(124, 140, 255, .3);
    }

    @media (max-width:880px) {
      .grid {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media (max-width:520px) {
      .grid {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>ModernExpressTemplate &mdash; <span>Core Stack</span></h1>
    <p>The major libraries this Express&nbsp;5 + TypeScript template is built on.</p>
  </header>
  <main class="grid" id="grid"></main>

  <script>
    // Each entry maps a library to the SVG icon file sitting beside this HTML file.
    const libraries = [
      { file: "nodedotjs.svg", name: "Node.js", role: "Runtime", ver: "v22+" },
      { file: "express.svg", name: "Express", role: "HTTP framework", ver: "v5" },
      { file: "typescript.svg", name: "TypeScript", role: "Language", ver: "v6" },
      { file: "zod.svg", name: "Zod", role: "Schema validation", ver: "v4" },
      { file: "mongodb.svg", name: "MongoDB", role: "Database", ver: "v7" },
      { file: "mongoose.svg", name: "Mongoose", role: "ODM", ver: "v9" },
      { file: "dotenv.svg", name: "DotEnv", role: "Environment variables", ver: "v16" },
      { file: "swagger.svg", name: "Swagger", role: "API docs (OpenAPI)", ver: "3.0" },
      { file: "openapiinitiative.svg", name: "OpenAPI Initiative", role: "API Specification", ver: "3.0" },
      { file: "eslint.svg", name: "ESLint", role: "Linting", ver: "v10" },
    ];

    const grid = document.getElementById("grid");

    // Build one card per library and drop it into the grid.
    libraries.forEach(({ file, name, role, ver }) => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
      <span class="logo">
        <img src="${file}" alt="${name} logo" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
        <span class="fallback" aria-hidden="true">${name.charAt(0)}</span>
      </span>
      <div class="meta">
        <h2>${name}</h2>
        <p>${role}</p>
      </div>
      <span class="pill">${ver}</span>`;
      grid.appendChild(card);
    });
  </script>
</body>

</html>
